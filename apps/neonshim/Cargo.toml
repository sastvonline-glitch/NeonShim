[package]
name = "neonshim"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
neonshim-core.workspace = true
neonshim-pe.workspace = true
neonshim-loader.workspace = true
neonshim-hle.workspace = true
neonshim-shader = { workspace = true, features = ["host"] }
neonshim-game.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true

[features]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "neonshim-core/diagnostics",
    "neonshim-hle/diagnostics",
    "neonshim-loader/diagnostics",
    "neonshim-shader/diagnostics",
]

[lints]
workspace = true
