# Copy to `neonshim.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# NEONSHIM_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: NEONSHIM_GAME_DIR
game_dir = 'D:\neonshim-data\game'

# Derived data. Default: %LOCALAPPDATA%\neonshim\cache.   env: NEONSHIM_CACHE_DIR
# cache_dir = 'D:\neonshim-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\neonshim\data.   env: NEONSHIM_DATA_DIR
# data_dir = 'D:\neonshim-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: NEONSHIM_TEST_TITLES (separated by ';')
test_titles = []
